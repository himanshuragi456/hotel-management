<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" fill="none">
  <defs>
    <linearGradient id="vg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="vg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="vg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Three management pillars -->
  <rect x="4"  y="10" width="10" height="32" rx="3" fill="url(#vg1)"/>
  <rect x="19" y="22" width="10" height="20" rx="3" fill="url(#vg2)"/>
  <rect x="34" y="16" width="10" height="26" rx="3" fill="url(#vg3)"/>

  <!-- Connector bar -->
  <rect x="4" y="10" width="40" height="5" rx="2.5" fill="url(#vg1)"/>

  <!-- Magic dot -->
  <circle cx="47" cy="8" r="3" fill="#7C3AED" opacity="0.85"/>
  <circle cx="47" cy="8" r="1.5" fill="white"/>

  <!-- Wordmark -->
  <text
    x="58" y="25"
    font-family="'Poppins', 'Inter', 'Segoe UI', system-ui, sans-serif"
    font-weight="700"
    font-size="17"
    fill="#1E293B"
    letter-spacing="-0.5"
  >Magic</text>

  <text
    x="58" y="42"
    font-family="'Poppins', 'Inter', 'Segoe UI', system-ui, sans-serif"
    font-weight="500"
    font-size="12"
    fill="#64748B"
    letter-spacing="1.5"
  >MANAGEMENT</text>
</svg>
